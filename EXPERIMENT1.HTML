```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College ID Card - Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9eef5;
        }

        /* ID Card */
        .id-card {
            width: 380px;
            height: 540px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.20);
            position: relative;
        }

        /* Demo Watermark */
        .watermark {
            position: absolute;
            top: 245px;
            left: 35px;
            transform: rotate(-25deg);
            font-size: 42px;
            font-weight: bold;
            color: rgba(200, 0, 0, 0.12);
            z-index: 5;
            pointer-events: none;
        }

        /* Header */
        .header {
            height: 115px;
            background: linear-gradient(135deg, #173b72, #2563a8);
            color: white;
            text-align: center;
            padding-top: 18px;
        }

        .header h2 {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .demo-label {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border: 1px solid white;
            border-radius: 15px;
            font-size: 10px;
            font-weight: bold;
        }

        /* Profile */
        .profile {
            text-align: center;
            padding-top: 22px;
        }

        .photo {
            width: 120px;
            height: 145px;
            border: 4px solid #2563a8;
            border-radius: 8px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #edf2f7;
            color: #777;
            font-size: 13px;
        }

        .profile h3 {
            margin-top: 12px;
            font-size: 21px;
            color: #173b72;
        }

        .profile p {
            color: #555;
            margin-top: 4px;
            font-size: 14px;
        }

        /* Details */
        .details {
            margin: 18px 30px;
            border-top: 1px solid #ddd;
            padding-top: 12px;
        }

        .row {
            display: flex;
            margin: 8px 0;
            font-size: 13px;
        }

        .label {
            width: 105px;
            font-weight: bold;
            color: #333;
        }

        .value {
            color: #555;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: #173b72;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="id-card">

        <!-- DEMO WATERMARK -->
        <div class="watermark">DEMO</div>

        <!-- Header -->
        <div class="header">
            <h2>YOUR COLLEGE NAME</h2>
            <p>College Campus • Uttar Pradesh</p>

            <span class="demo-label">
                WEB DEVELOPMENT DEMO
            </span>
        </div>

        <!-- Student Profile -->
        <div class="profile">

            <div class="photo">
                STUDENT PHOTO
            </div>

            <h3>Ashish Maurya</h3>

            <p>B.Tech – Computer Science & Engineering</p>

        </div>

        <!-- Student Details -->
        <div class="details">

            <div class="row">
                <div class="label">Student ID</div>
                <div class="value">DEMO-CSE-001</div>
            </div>

            <div class="row">
                <div class="label">Branch</div>
                <div class="value">CSE-C1</div>
            </div>

            <div class="row">
                <div class="label">Year</div>
                <div class="value">2nd Year</div>
            </div>

            <div class="row">
                <div class="label">Session</div>
                <div class="value">2026–27</div>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            DEMONSTRATION CARD — NOT A VALID COLLEGE ID
        </div>

    </div>

</body>
</html>
```
